name: Sandbox acceptance

on:
  push:
    branches: [develop]
    paths:
      - "packages/runtime/src/node/sandbox/**"
      - "packages/runtime/src/runtime/sandbox/**"
      - ".github/workflows/sandbox.yml"
  pull_request:
    paths:
      - "packages/runtime/src/node/sandbox/**"
      - "packages/runtime/src/runtime/sandbox/**"
      - ".github/workflows/sandbox.yml"

permissions:
  contents: read

jobs:
  docker-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run real Docker Sandbox acceptance
        env:
          LLM_SPACE_DOCKER_ACCEPTANCE: "1"
        run: |
          set -o pipefail
          if ! bun test packages/runtime/src/node/sandbox/docker-sandbox-acceptance.test.ts 2>&1 | tee /tmp/sandbox-acceptance.log; then
            details=""
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              details+="${line}%0A"
            done < <(tail -n 60 /tmp/sandbox-acceptance.log)
            echo "::error file=.github/workflows/sandbox.yml,line=28,title=Sandbox acceptance failed::${details}"
            exit 1
          fi
