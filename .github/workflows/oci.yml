name: OCI

on:
  pull_request:
    paths:
      - ".github/workflows/oci.yml"
      - "apps/example-agent/**"
      - "bun.lock"
      - "package.json"
      - "packages/cli/**"
      - "packages/runtime/**"
      - "packages/server/**"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/oci.yml"
      - "apps/example-agent/**"
      - "bun.lock"
      - "package.json"
      - "packages/cli/**"
      - "packages/runtime/**"
      - "packages/server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v3

      - name: Generate engine-neutral OCI context
        run: >-
          bun packages/cli/src/index.ts build apps/example-agent
          --target oci --output "$RUNNER_TEMP/llm-space-oci"

      - name: Run OCI acceptance
        env:
          LLM_SPACE_OCI_LIVE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          bun packages/cli/src/oci-acceptance.ts
          --context "$RUNNER_TEMP/llm-space-oci"
